<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Shackle Metal Gradient -->
    <linearGradient id="shackleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A6A6B0" />
      <stop offset="35%" stop-color="#E2E2E8" />
      <stop offset="70%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#8E8E9A" />
    </linearGradient>

    <!-- Lock Body Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDC48" />
      <stop offset="50%" stop-color="#FFA726" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>

    <!-- Key Soft Purple Gradient -->
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECE5F8" />
      <stop offset="45%" stop-color="#D1C4E9" />
      <stop offset="100%" stop-color="#9FA8DA" />
    </linearGradient>

    <!-- Subtle Drop Shadow for the Key -->
    <filter id="keyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-1.5" dy="1.5" stdDeviation="1.2" flood-color="#2D1B4E" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Metallic Lock Shackle -->
  <path d="M 21 24 V 13.5 C 21 8.3 25.2 4 30.5 4 C 35.8 4 40 8.3 40 13.5 V 24" 
        fill="none" 
        stroke="url(#shackleGrad)" 
        stroke-width="5.5" 
        stroke-linecap="round" />

  <!-- Main Lock Body -->
  <rect x="10" y="21" width="37" height="36" rx="8" fill="url(#bodyGrad)" />

  <!-- Keyhole -->
  <g fill="#372056">
    <circle cx="28.5" cy="34" r="4" />
    <path d="M 25.5 35.5 L 26.5 44.5 C 26.5 45.8 30.5 45.8 30.5 44.5 L 31.5 35.5 Z" />
  </g>

  <!-- Overlaid Key -->
  <g filter="url(#keyShadow)">
    <!-- Key Body (Head + Shaft + Teeth) -->
    <path d="
      M 48 13 
      A 7.5 7.5 0 0 1 54.5 24.5
      C 53.2 26.2 51.5 27.2 49.5 27.5
      V 47.5
      C 49.5 49.5 46.5 49.5 46.5 47.5
      V 42.5
      H 44
      V 39.5
      H 46.5
      V 36.5
      H 44
      V 33.5
      H 46.5
      V 27.5
      C 44.5 27.2 42.8 25.8 42 23.5
      A 7.5 7.5 0 0 1 48 13 Z" 
      fill="url(#keyGrad)" />
      
    <!-- Key Eyelet Highlight -->
    <circle cx="49.5" cy="18.5" r="2.2" fill="#FFFFFF" opacity="0.95" />
  </g>
</svg>
